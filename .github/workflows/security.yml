name: security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: Link check (internal + external)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # lychee 0.18 no longer knows --root (replaced by --root-dir, which needs an
          # absolute path). This site only uses relative links, so a root is not
          # needed. localhost (sample README), mailto: and linkedin (returns
          # 999 to automated agents / bot blocking) are excluded to avoid false positives.
          args: >-
            --no-progress
            --exclude 'localhost'
            --exclude 'mailto:'
            --exclude 'linkedin\.com'
            index.html pipelines/index.html README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  html-validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # The static markup of the three pages is checked. The limit: DOM built by
      # JavaScript (stage columns, trace, source tree) does not come through here, so
      # a rule like the type on a button is only proven for what is in the
      # HTML files; the rest is verified in a browser, not assumed valid.
      - run: npx --yes html-validate@8 index.html 404.html pipelines/index.html reports/index.html decisions/index.html
