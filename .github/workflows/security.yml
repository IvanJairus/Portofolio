name: security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: Link check (internal + external)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # lychee 0.18 tidak lagi mengenal --root (diganti --root-dir dan wajib
          # path absolut). Situs ini hanya memakai tautan relatif, jadi root tidak
          # diperlukan. localhost (README contoh), mailto:, dan linkedin (mengembalikan
          # 999 ke agen otomatis / blokir bot) dikecualikan agar tidak false-positive.
          args: >-
            --no-progress
            --exclude 'localhost'
            --exclude 'mailto:'
            --exclude 'linkedin\.com'
            index.html README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  html-validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npx --yes html-validate@8 index.html
